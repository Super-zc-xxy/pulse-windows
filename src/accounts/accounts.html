<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse 设置</title>
  <link rel="stylesheet" href="accounts.css">
</head>
<body>
  <header><h1>Pulse 设置</h1><button id="refresh">刷新</button></header>
  <p id="message" role="status" aria-live="polite"></p>
  <section>
    <h2>显示与数据</h2>
    <div class="fields">
      <label>停靠位置<select id="dock-side"><option value="right">右侧</option><option value="left">左侧</option><option value="top">顶部</option></select></label>
      <label>圆环数值<select id="countdown-mode"><option value="left">剩余额度</option><option value="used">已用额度</option></select></label>
      <label>数据模式<select id="demo-mode"><option value="false">真实数据</option><option value="true">演示数据</option></select></label>
    </div>
    <button id="save-settings">保存设置</button>
  </section>
  <h2>账户与数据状态</h2>
  <main id="accounts"></main>
  <script src="pulse.js"></script><script src="accounts.js"></script>
</body>
</html>
